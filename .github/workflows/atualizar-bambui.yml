name: Atualizar empreendimentos da Bambuí

# Lê o site da Bambuí, aplica os ajustes de data/bambui-ajustes.json e atualiza o catálogo que o site publica.
# Roda todo dia, quando o arquivo de ajustes muda (preço, registro de incorporação…) e sob demanda (aba Actions > Run workflow).
on:
  schedule:
    - cron: '0 9 * * *' # 06:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/bambui-ajustes.json']

permissions:
  contents: write

concurrency:
  group: atualizar-bambui
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: backend

      # Se o site da Bambuí estiver fora do ar ou os ajustes tiverem erro, esta etapa falha e NADA muda no site
      - name: Gerar o catálogo
        run: npm run export:bambui
        working-directory: backend

      - name: Publicar se mudou
        run: |
          git config user.name "habitse-bot"
          git config user.email "habitse-bot@users.noreply.github.com"
          git add frontend/public/data/empreendimentos.json frontend/public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Sem mudanças no catálogo."
          else
            git commit -m "Atualiza os empreendimentos da Bambuí (automático)"
            git push
          fi
