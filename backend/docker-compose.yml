# Só para desenvolvimento local: Postgres e Redis. (Produção não usa Docker — veja ../DEPLOY.md)
services:
    postgres:
        image: postgres:16
        container_name: habitse-pg
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: habitse
        ports:
            - '5432:5432'
        volumes:
            - ./docker/postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:7
        container_name: habitse-redis
        restart: unless-stopped
        ports:
            - '6379:6379'
